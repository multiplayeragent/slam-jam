<script type="module">
/* ═══ SLAM JAM · a Multiplayer Agent starter ═══════════════════════════════════════════════
 * Arcade 2-on-2 basketball on a full court, seen from the side like a TV broadcast.
 * Sunburners (orange) against Riptides (blue). Versus, 2–4 players; bots fill every empty spot.
 * Turbo, shoves and steals, blocks, passes, flying dunks, threes, a shot clock, and a player who
 * scores 3 in a row catches fire until the other team scores.
 *
 * WHERE THINGS ARE (search for the "── " headers):
 *   CONFIG ........ clocks, court size, running, jumping, shooting odds, dunks, defence, bots
 *   CONNECTION .... MP_CONNECT, joining, the offline room, who is host
 *   COURT ......... rims, the 3-point line, spots, the ball's flights (shots, passes, dunks), a loose ball
 *   ARENA ......... renderer, floor, hoops, the crowd, the ballers, the ball, particles, sound
 *   GAME (HOST) ... seats, the score, the ball, shot results, steals, blocks, quarters. Only the host writes these.
 *   BOTS .......... the bot brain: drive, dunk, shoot, pass, guard your man, block, crash the boards
 *   ME ............ my baller: running, turbo, jumping, shooting, passing, stealing
 *   VIEWS ......... everyone else's ballers, eased between writes; the ball between writes
 *   DRAW .......... the ballers, the ball, effects and the broadcast camera that follows the ball
 *   HUD & RESULTS . scorebug, clocks, announcer callouts, results card, leaderboard, the shot meter, the YOU arrow
 *   INPUT ......... keyboard, and a thumb stick + SHOOT / PASS / TURBO buttons on touch
 *   MAIN LOOP ..... one frame: host work, my baller, drawing
 *
 * HOW THE MULTIPLAYER WORKS (a relay room: no server code):
 *   - Each player writes its OWN entity: `p` {x, z, vx, vz, j, a} (its baller on the court, j = jump
 *     height, a = knocked down / swiping / shooting) about 14 times a second, `hb` (heartbeat) once a
 *     second, `rdy` (Play again), `n`/`c` (name, color) once.
 *   - The HOST is the lowest sessionId among live players (heartbeat seen in the last 3s), worked out
 *     every frame. The ball is shared, so the host owns it. Only the host writes the shared fields:
 *       `game` {id, v, phase, seats, score, q, ko, liveAt, qEnds, shotEnds, poss, pts, streak, fire, call, …}:
 *              who plays in which of the 4 seats (sessionIds or bots "b1".."b4"), the score, quarters,
 *              the clocks (timestamps), who is on fire and the announcer's latest callout. `v` goes up on
 *              every write; `ko` counts quarter starts (everyone walks back to their spot).
 *       `ball` {st, own, x, y, z, vx, vy, vz, f, at, b, s}: held by `own`, in a flight `f` (a shot, pass or
 *              dunk, with its result already decided), or loose; plus every bot's baller in `b`.
 *   - Everyone else sends intents: "shoot" {x, z, j, q, dunk} (q = how close to the top of your jump you let
 *     go), "pass" {}, "swipe" {turbo} (steal, or with turbo a shove). The host checks them against the
 *     latest positions, rolls the result with a seeded random from the flight's number, and writes the
 *     ball. A flight is written once: every screen draws the arc itself, so shots and dunks fly smoothly.
 *   - "knock" {id} from the host tells a shoved player to fall over (its own client moves its baller).
 *   - A new host adopts `game` and `ball` (and the bots in it) and carries on. A host whose tab froze stops
 *     hosting, waits 0.7s for fresh state, and adopts it, so it never writes its old copy back.
 *   - ?attract plays offline, bots only (the preview video is recorded from it).
 *   - Leaderboard "slam-points": each player's most points in one game.
 */
import * as THREE from "three";

// ── CONFIG ──────────────────────────────────────────────────────────────────────────
const CONFIG = {
  quarters: 4,           // quarters in a game
  quarterMs: 45000,      // ms of game clock per quarter
  overtimeMs: 25000,     // a tie after the last quarter plays this much overtime
  shotClockMs: 14000,    // ms a team has to shoot before the ball goes to the other team
  readyMs: 2600,         // ms everyone waits on their spot before a quarter starts
  scoreMs: 1500,         // ms after a basket before the other team takes the ball
  breakMs: 2600,         // ms between quarters
  resultsMs: 15000,      // ms on the results card before the next game (Play again skips it)
  // The court, in metres: x runs along it, z across it; the camera sits on the +z side.
  courtL: 28, courtW: 15,
  rimX: 12.6,            // each rim's distance from the middle; Sunburners shoot at +x, Riptides at -x
  rimY: 3.05, rimR: 0.23, ballR: 0.15,
  threeR: 6.75,          // shots from further out than this score 3
  // Running and jumping
  runSpeed: 6.2, turboSpeed: 9.4, accel: 10, // m/s, and how snappy the start and stop are
  turboMax: 100, turboDrain: 40, turboRegen: 16, // turbo meter: used per second while held, refilled per second when not
  jumpV: 6.0, gravity: 16, // jump speed and gravity (a jump peaks after jumpV / gravity seconds)
  bodyR: 0.42,           // ballers keep twice this apart
  // Shooting
  perfectWin: 0.06,      // let go within this many seconds of the top of your jump for a perfect release...
  releaseWin: 0.34,      // ...this far off it, the release is as bad as it gets
  shotBase: 0.85, shotPerM: 0.045, shotMin: 0.15, // chance a shot goes in: base, minus this per metre out (never below shotMin)
  contestR: 1.2, contestX: 0.75, // a defender this close cuts the chance to this share
  fireAfter: 3,          // baskets in a row (with no answer from the other team) to catch fire
  fireBonus: 0.25,       // on fire: this much added to every shot's chance, and endless turbo
  dunkRange: 3.6, dunkRangeTurbo: 6.0, // how close to the rim you can take off for a dunk (further with turbo)
  dunkMs: [800, 1250],   // hang time of a dunk, from close in to far out
  dunkPeak: 4.7,         // how high the ball goes on a dunk (the rim is at 3.05)
  dunkMake: 0.93,        // chance a dunk goes down if nobody blocks it...
  dunkContested: 0.75,   // ...times this when a defender is on the dunker or under the rim
  passSpeed: 17,         // m/s
  intercept: 0.35,       // chance a defender standing in the passing lane picks a pass off
  // Defence
  stealR: 1.7, stealChance: 0.32, shoveChance: 0.75, swipeCd: 700, knockMs: 1000, // PASS on defence steals; with turbo it shoves
  blockR: 1.5, blockChance: 0.6, blockJ: 0.45, // a defender this high in the air, this close, blocks a shot this often
  pickupR: 1.0,          // how close you must be to grab a loose ball
  // Bots
  botSpeed: 0.9,         // share of top speed
  botThink: 240,         // ms between decisions
  botThree: 0.3, botMid: 0.2, // share of a bot's possessions it looks for a three, or a jumper (the rest it drives)
  botDunk: 0.85, botPass: 0.25, // chances, per decision, to dunk when close, and to pass when crowded
  botSteal: 0.07, botBlock: 0.45, // chances to swipe at the ball, and to jump at a shot
  botRelease: [0.02, 0.16], // seconds off the perfect release a bot lets go: best, worst
  sendMs: 70,            // my baller and the ball (~14 a second)
  board: "slam-points",
};
const TEAMS = [{ name: "Sunburners", short: "SUN", color: "#ff6a1a", dark: "#8f2e00" }, { name: "Riptides", short: "RIP", color: "#1e9bff", dark: "#0b3f80" }];
const COLORS = ["#ffd23f", "#ffffff", "#7cf29a", "#c99bff", "#ff5c8a", "#3ee6d8", "#b6ff4a", "#ffa94d"]; // each baller's own color: headband, shoes, ring
const BOT_NAMES = ["Rimrattler", "Lefty Lou", "Big Moe", "Zip Zappa"]; // the bot in seat 0..3
const SKINS = ["#f1c9a5", "#c68a5a", "#8d5a3b", "#e8b48a", "#5e3a24"];
const CALLS = { // the announcer: our own lines
  dunk: ["KA-BLAMMALAMMA!", "THUNDER SLAM!", "RIM WRECKER!", "SKY HIGH!", "WHAMMO-JAMMO!"],
  three: ["FROM DOWNTOWN!", "SPLASH!", "BANG! WAY OUT!", "NOTHING BUT NYLON!"],
  two: ["BUCKETS!", "IN THE HOLE!", "SMOOTH!", "COUNT IT!"],
  block: ["SWAT CITY!", "GET THAT OUTTA HERE!", "DENIED!"],
  steal: ["PICKPOCKET!", "STOLEN!", "TOO SLOW!"],
  shove: ["TIMBER!", "FLATTENED!"],
  fire: "ON FIRE!", warm: "getting warm…", buzzer: "AT THE BUZZER!", clock: "SHOT CLOCK!", douse: "fire's out",
};

// ── CONNECTION ──────────────────────────────────────────────────────────────────────
// The builder fills these in for this game. Downloaded from GitHub? Put your own pk_ key here.
const MP_CONNECT = {
  key: 'pk_REPLACE_ME',
  room: 'slam-jam',
  endpoint: 'wss://live.multiplayeragent.com',
  apiUrl: 'https://api.multiplayeragent.com',
};
const ATTRACT = new URLSearchParams(location.search).has("attract");
const TEST = new URLSearchParams(location.search).has("test");

/** Same shape as the SDK client, kept in this tab: offline play and ?attract. */
function localRoom() {
  const id = "local", state = { entities: { players: { [id]: {} } }, shared: {} }, subs = [];
  let queued = false;
  const emit = () => { if (!queued) { queued = true; queueMicrotask(() => { queued = false; subs.forEach((f) => f(state)); }); } };
  const put = (o, k, v) => { if (typeof k === "object") Object.assign(o, k); else o[k] = v; emit(); };
  return {
    sessionId: id, state, offline: true,
    me: { set: (k, v) => put(state.entities.players[id], k, v) },
    setShared: (k, v) => put(state.shared, k, v),
    onState: (f) => { subs.push(f); f(state); }, onJoin() {}, onLeave() {}, on() {}, send() {},
    onDisconnect() {}, onReconnect() {}, leave: async () => {},
  };
}
async function connect() {
  if (ATTRACT || typeof MP === "undefined") return localRoom();
  try {
    const mp = await Promise.race([MP.join({ ...MP_CONNECT }), new Promise((_, no) => setTimeout(() => no(new Error("timed out")), 10000))]);
    window.mp = mp; // the builder calls window.mp.leave() when the page closes
    return mp;
  } catch (e) {
    console.warn("Playing offline:", e && e.message);
    return localRoom();
  }
}
const parse = (v, fb) => { if (typeof v !== "string") return fb; try { return JSON.parse(v); } catch { return fb; } };
const memo = new Map();
/** A JSON field, parsed once per change (read-only: never mutate what this returns). */
function cached(key, raw, fb) { const m = memo.get(key); if (m && m.raw === raw) return m.v; const v = parse(raw, fb); memo.set(key, { raw, v }); return v; }
let net = null, S = { entities: { players: {} }, shared: {} };
const seenHb = new Map();
/** Players whose heartbeat moved in the last 3s (plus us), sorted by sessionId. */
function livePlayers() {
  const now = performance.now(), out = [];
  for (const [id, p] of Object.entries(S.entities.players || {})) {
    const s = seenHb.get(id);
    if (!s || s.hb !== p.hb) seenHb.set(id, { hb: p.hb, at: now });
    if (id === net.sessionId || now - seenHb.get(id).at < 3000) out.push(id);
  }
  return out.sort();
}
/** Am I the host? Never in the first 0.7s after this tab wakes from a freeze (fresh state arrives first). */
const isHost = () => performance.now() >= host.quietUntil && livePlayers()[0] === net.sessionId;
const humans = () => livePlayers().filter((id) => !(ATTRACT && id === net.sessionId)); // in the preview you only watch

// ── COURT ───────────────────────────────────────────────────────────────────────────
// Metres. x runs along the court (-HL..HL), z across it (-HW..HW), y is up. Seats 0 and 1 are the
// Sunburners (team 0, shooting at +x); seats 2 and 3 the Riptides (team 1, shooting at -x).
const HL = CONFIG.courtL / 2, HW = CONFIG.courtW / 2, BALL_G = 9.8;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, u) => a + (b - a) * u;
const r2 = (v) => Math.round(v * 100) / 100;
const teamOfSeat = (s) => (s < 2 ? 0 : 1);
const attackDir = (team) => (team === 0 ? 1 : -1);          // which way a team shoots
const rimXOf = (team) => attackDir(team) * CONFIG.rimX;       // the rim a team shoots at
const rimDist = (x, z, team) => Math.hypot(x - rimXOf(team), z);
const isBot = (id) => /^b\d$/.test(id);
const botId = (seat) => "b" + (seat + 1);
const SPOTS = [[-1.2, 0.3], [-5.5, 4.2], [1.2, -0.3], [5.5, -4.2]]; // where seats 0..3 stand when a quarter starts
const peakT = () => CONFIG.jumpV / CONFIG.gravity;            // seconds from take-off to the top of a jump
/** How good a release is, 1 = perfect, from how many seconds off the top of the jump it was. */
function releaseQuality(off) { off = Math.abs(off); return off <= CONFIG.perfectWin ? 1 : clamp(1 - (off - CONFIG.perfectWin) / (CONFIG.releaseWin - CONFIG.perfectWin), 0, 1); }
/** A small seeded random (mulberry32): the same seed gives the same numbers on every screen. */
function mulberry32(a) { return () => { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const newFlightId = () => 1 + Math.floor(Math.random() * 2e9);
/** Keep a baller on the court (a little past the lines is fine). */
function keepOnCourt(d) { d.x = clamp(d.x, -HL - 0.6, HL + 0.6); d.z = clamp(d.z, -HW - 0.6, HW + 0.6); }
/** Push baller d away from baller o if they overlap. */
function pushApart(d, o) {
  const dx = d.x - o.x, dz = d.z - o.z, dist = Math.hypot(dx, dz), min = CONFIG.bodyR * 2;
  if (dist >= min || dist < 0.001) return;
  d.x += (dx / dist) * (min - dist) * 0.5; d.z += (dz / dist) * (min - dist) * 0.5;
}

// The ball's flights. Each is decided by the host when it starts and written once into `ball.f`;
// every screen then draws it from the same numbers and its own clock since the flight began.
/** A jump shot from (x0, y0, z0): an arc into the rim's middle (made) or onto its edge (a miss). */
function shotFlight(n, by, team, x0, y0, z0, made, pts, rng) {
  const rx = rimXOf(team);
  let tx = rx, tz = 0, ty = CONFIG.rimY + 0.05;
  if (!made) { // clang: somewhere on the rim, mostly the side facing the shooter
    const ang = Math.atan2(z0, x0 - rx) + (rng() - 0.5) * 2.4;
    tx = rx + Math.cos(ang) * (CONFIG.rimR + 0.1); tz = Math.sin(ang) * (CONFIG.rimR + 0.1); ty = CONFIG.rimY + 0.12;
  }
  const T = 0.6 + Math.hypot(tx - x0, tz - z0) * 0.06;
  return { n, k: "shot", by, team, made: made ? 1 : 0, pts, t0: Date.now(), T: r2(T), x0: r2(x0), y0: r2(y0), z0: r2(z0),
    vx: r2((tx - x0) / T), vy: r2((ty - y0 + 0.5 * BALL_G * T * T) / T), vz: r2((tz - z0) / T) };
}
